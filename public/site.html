<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Online — Pedidos, Conta e Atendimento</title>
  <style>
    :root {
      --bg: #f6f4f0;
      --card: #ffffff;
      --text: #1f2421;
      --muted: #5c6660;
      --primary: #b43b1e;
      --primary-hover: #932e16;
      --accent: #1d6f42;
      --border: #e2ddd5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.45; }
    header {
      background: #181c1a; color: #fff; padding: 14px 20px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 20;
    }
    .brand { font-size: 1.15rem; font-weight: 700; }
    .nav-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, input, select, textarea { font: inherit; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      font-weight: 600; background: var(--primary); color: #fff;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline {
      background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.35);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .btn-dark { background: #262c29; color: #fff; }
    .btn-success { background: var(--accent); color: #fff; }
    .container { max-width: 1180px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 920px) { .container { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .toolbar input, .toolbar select {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
    }
    .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .prod-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px; background: #fff;
    }
    .prod-cat { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .prod-nome { font-size: 1rem; font-weight: 700; }
    .prod-desc { font-size: 0.85rem; color: var(--muted); }
    .prod-preco { font-size: 1.05rem; font-weight: 800; color: var(--primary); }
    .sidebar { display: flex; flex-direction: column; gap: 16px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;
    }
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border);
      background: #f2efe9; cursor: pointer; font-weight: 700;
    }
    .total-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.05rem; margin: 12px 0; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .field input, .field select, .field textarea {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; width: 100%;
    }
    .msg { font-size: 0.85rem; margin-top: 8px; padding: 8px 10px; border-radius: 8px; display: none; }
    .msg.ok { display: block; background: #e7f6ed; color: #155724; }
    .msg.err { display: block; background: #fdecea; color: #842029; }
    .bot-box { display: flex; flex-direction: column; gap: 8px; }
    .bot-log {
      max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; background: #faf9f6; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem;
    }
    .bubble { padding: 8px 10px; border-radius: 8px; max-width: 90%; white-space: pre-line; }
    .bubble.user { background: var(--primary); color: #fff; align-self: flex-end; }
    .bubble.bot { background: #ece8e1; color: var(--text); align-self: flex-start; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
      align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; padding: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
      background: #f5f3ef; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .user-pill { font-size: 0.85rem; background: rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand" id="lojaNome">Loja Online</div>
    <div class="nav-actions">
      <span class="user-pill" id="contaStatus">Visitante</span>
      <button class="btn btn-outline" id="btnAbrirConta" type="button">Minha Conta</button>
      <button class="btn btn-outline" id="btnSairConta" type="button" style="display:none;">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="section-title">Cardápio / Produtos</h1>
      <div class="toolbar">
        <input type="search" id="buscaProduto" placeholder="Buscar produto..." />
        <select id="filtroCategoria">
          <option value="">Todas as categorias</option>
        </select>
        <button class="btn btn-dark" id="btnRecarregarProdutos" type="button">Atualizar</button>
      </div>
      <div class="grid-produtos" id="listaProdutos">Carregando produtos...</div>
    </section>

    <aside class="sidebar">
      <section class="card">
        <h2 class="section-title">Carrinho</h2>
        <div id="itensCarrinho">Seu carrinho está vazio.</div>
        <div class="total-row">
          <span>Total</span>
          <span id="totalCarrinho">R$ 0,00</span>
        </div>

        <div class="field">
          <label for="cliNome">Seu nome</label>
          <input type="text" id="cliNome" placeholder="Nome completo" />
        </div>
        <div class="field">
          <label for="cliTelefone">Telefone / WhatsApp</label>
          <input type="tel" id="cliTelefone" placeholder="(41) 99999-9999" />
        </div>
        <div class="field">
          <label for="cliPagamento">Forma de pagamento</label>
          <select id="cliPagamento">
            <option value="PIX">PIX</option>
            <option value="DINHEIRO">Dinheiro</option>
            <option value="CARTAO">Cartão</option>
          </select>
        </div>
        <div class="field">
          <label for="cliObs">Observações</label>
          <input type="text" id="cliObs" placeholder="Ex.: sem cebola, troco..." />
        </div>
        <button class="btn btn-success" id="btnFinalizarPedido" type="button" style="width:100%;">Finalizar Pedido</button>
        <div class="msg" id="msgPedido"></div>
      </section>

      <section class="card">
        <h2 class="section-title">Atendimento / Bot</h2>
        <div class="bot-box">
          <div class="bot-log" id="botLog">
            <div class="bubble bot">Olá! Como posso ajudar com os produtos ou seu pedido?</div>
          </div>
          <div style="display:flex; gap:6px;">
            <input type="text" id="botInput" placeholder="Digite sua dúvida..." style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px;" />
            <button class="btn" id="btnEnviarBot" type="button">Enviar</button>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <div class="modal-backdrop" id="modalConta">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="section-title" style="margin:0;">Conta do Cliente</h2>
        <button class="btn btn-dark" id="btnFecharConta" type="button">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Entrar</button>
        <button class="tab-btn" id="tabCadastro" type="button">Cadastrar</button>
      </div>

      <form id="formLogin">
        <div class="field">
          <label for="loginIdentificador">Telefone ou E-mail</label>
          <input type="text" id="loginIdentificador" required />
        </div>
        <div class="field">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" required />
        </div>
        <button class="btn" type="submit" style="width:100%;">Entrar na Conta</button>
      </form>

      <form id="formCadastro" style="display:none;">
        <div class="field">
          <label for="cadNome">Nome</label>
          <input type="text" id="cadNome" required />
        </div>
        <div class="field">
          <label for="cadTelefone">Telefone</label>
          <input type="tel" id="cadTelefone" required />
        </div>
        <div class="field">
          <label for="cadEmail">E-mail</label>
          <input type="email" id="cadEmail" required />
        </div>
        <div class="field">
          <label for="cadSenha">Senha (mín. 8 caracteres)</label>
          <input type="password" id="cadSenha" minlength="8" maxlength="200" required />
        </div>
        <button class="btn btn-success" type="submit" style="width:100%;">Criar Conta</button>
      </form>

      <div class="msg" id="msgConta"></div>
    </div>
  </div>

  <script>
    const API = '';
    let produtosCache = [];
    let carrinho = JSON.parse(localStorage.getItem('site_carrinho_v1') || '[]');
    let clienteLogado = JSON.parse(localStorage.getItem('site_cliente_v1') || 'null');

    const fmtBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function setMsg(el, texto, ok = false) {
      el.textContent = texto;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    function atualizarHeaderConta() {
      const statusEl = document.getElementById('contaStatus');
      const btnSair = document.getElementById('btnSairConta');
      if (clienteLogado && clienteLogado.nome) {
        statusEl.textContent = 'Olá, ' + clienteLogado.nome;
        btnSair.style.display = 'inline-block';
        if (!document.getElementById('cliNome').value) document.getElementById('cliNome').value = clienteLogado.nome || '';
        if (!document.getElementById('cliTelefone').value) document.getElementById('cliTelefone').value = clienteLogado.telefone || '';
      } else {
        statusEl.textContent = 'Visitante';
        btnSair.style.display = 'none';
      }
    }

    function salvarCarrinho() {
      localStorage.setItem('site_carrinho_v1', JSON.stringify(carrinho));
      renderCarrinho();
    }

    function adicionarAoCarrinho(prodId) {
      const p = produtosCache.find(x => String(x.id) === String(prodId));
      if (!p) return;
      const preco = Number(p.preco_venda ?? p.preco ?? 0);
      const existente = carrinho.find(i => String(i.id) === String(p.id));
      if (existente) {
        existente.qty += 1;
      } else {
        carrinho.push({ id: p.id, produto_id: p.id, nome: p.nome, produto_nome: p.nome, preco, qty: 1 });
      }
      salvarCarrinho();
    }

    function alterarQtd(idx, delta) {
      if (!carrinho[idx]) return;
      carrinho[idx].qty += delta;
      if (carrinho[idx].qty <= 0) carrinho.splice(idx, 1);
      salvarCarrinho();
    }

    function renderCarrinho() {
      const box = document.getElementById('itensCarrinho');
      const totalEl = document.getElementById('totalCarrinho');
      if (!carrinho.length) {
        box.innerHTML = 'Seu carrinho está vazio.';
        totalEl.textContent = fmtBRL(0);
        return;
      }
      let total = 0;
      box.innerHTML = carrinho.map((item, idx) => {
        const subtotal = Number(item.preco || 0) * Number(item.qty || 0);
        total += subtotal;
        return `
          <div class="cart-item">
            <div>
              <div><strong>${item.nome}</strong></div>
              <small>${fmtBRL(item.preco)} cada</small>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" type="button" onclick="alterarQtd(${idx}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn" type="button" onclick="alterarQtd(${idx}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
      totalEl.textContent = fmtBRL(total);
    }

    function renderProdutos() {
      const termo = document.getElementById('buscaProduto').value.trim().toLowerCase();
      const cat = document.getElementById('filtroCategoria').value;
      const grid = document.getElementById('listaProdutos');

      const filtrados = produtosCache.filter(p => {
        const matchCat = !cat || String(p.categoria || '') === cat;
        const matchBusca = !termo || String(p.nome || '').toLowerCase().includes(termo) || String(p.descricao || '').toLowerCase().includes(termo);
        return matchCat && matchBusca;
      });

      if (!filtrados.length) {
        grid.innerHTML = 'Nenhum produto encontrado.';
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        const preco = Number(p.preco_venda ?? p.preco ?? 0);
        return `
          <article class="prod-card">
            <div>
              <div class="prod-cat">${p.categoria || 'Geral'}</div>
              <div class="prod-nome">${p.nome}</div>
              <div class="prod-desc">${p.descricao || p.sabor || ''}</div>
            </div>
            <div>
              <div class="prod-preco" style="margin-bottom:8px;">${fmtBRL(preco)}</div>
              <button class="btn" type="button" style="width:100%;" onclick="adicionarAoCarrinho('${p.id}')">Adicionar ao Carrinho</button>
            </div>
          </article>
        `;
      }).join('');
    }

    async function carregarConfigEProdutos() {
      try {
        const cfgRes = await fetch(API + '/api/site/config');
        if (cfgRes.ok) {
          const cfgData = await cfgRes.json();
          const nomeLoja = cfgData?.config?.nome_loja || cfgData?.nome_loja;
          if (nomeLoja) document.getElementById('lojaNome').textContent = nomeLoja;
        }
      } catch {}

      try {
        const res = await fetch(API + '/api/site/produtos');
        const data = await res.json();
        produtosCache = Array.isArray(data) ? data : (data.produtos || data.dados || []);
        const selectCat = document.getElementById('filtroCategoria');
        const cats = [...new Set(produtosCache.map(p => p.categoria).filter(Boolean))];
        selectCat.innerHTML = '<option value="">Todas as categorias</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
        renderProdutos();
      } catch (e) {
        document.getElementById('listaProdutos').textContent = 'Erro ao carregar produtos.';
      }

      try {
        fetch(API + '/api/site/acesso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pagina: '/site.html', referrer: document.referrer || '' })
        }).catch(() => {});
      } catch {}
    }

    document.getElementById('btnFinalizarPedido').addEventListener('click', async () => {
      const msgEl = document.getElementById('msgPedido');
      msgEl.className = 'msg';
      if (!carrinho.length) return setMsg(msgEl, 'Adicione ao menos 1 item ao carrinho.');
      const cliente_nome = document.getElementById('cliNome').value.trim();
      const telefone = document.getElementById('cliTelefone').value.trim();
      if (!cliente_nome || !telefone) return setMsg(msgEl, 'Informe seu nome e telefone.');

      try {
        const res = await fetch(API + '/api/site/pedido', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origem: 'site',
            cliente_id: clienteLogado?.id || null,
            cliente_nome,
            telefone,
            forma_pagamento: document.getElementById('cliPagamento').value,
            observacao: document.getElementById('cliObs').value.trim(),
            itens: carrinho
          })
        });
        const data = await res.json();
        if (!res.ok || data.sucesso === false) {
          return setMsg(msgEl, data.erro || 'Não foi possível enviar o pedido.');
        }
        carrinho = [];
        salvarCarrinho();
        setMsg(msgEl, 'Pedido enviado com sucesso! Código #' + (data.pedido?.id || data.id || 'OK'), true);
      } catch (e) {
        setMsg(msgEl, 'Erro de conexão ao enviar pedido.');
      }
    });

    function appendBotBubble(texto, tipo = 'bot') {
      const log = document.getElementById('botLog');
      const div = document.createElement('div');
      div.className = 'bubble ' + tipo;
      div.textContent = texto;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function enviarMensagemBot() {
      const input = document.getElementById('botInput');
      const mensagem = input.value.trim();
      if (!mensagem) return;
      appendBotBubble(mensagem, 'user');
      input.value = '';
      try {
        const res = await fetch(API + '/api/bot/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem, cliente_id: clienteLogado?.id || null })
        });
        const data = await res.json();
        appendBotBubble(data.resposta || data.mensagem || data.erro || 'Sem resposta do bot no momento.');
      } catch {
        appendBotBubble('Não foi possível falar com o bot agora.');
      }
    }

    document.getElementById('btnEnviarBot').addEventListener('click', enviarMensagemBot);
    document.getElementById('botInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarMensagemBot();
    });

    // Conta (Login / Cadastro)
    const modalConta = document.getElementById('modalConta');
    const msgConta = document.getElementById('msgConta');
    document.getElementById('btnAbrirConta').addEventListener('click', () => {
      msgConta.className = 'msg';
      modalConta.classList.add('open');
    });
    document.getElementById('btnFecharConta').addEventListener('click', () => modalConta.classList.remove('open'));
    document.getElementById('btnSairConta').addEventListener('click', () => {
      clienteLogado = null;
      localStorage.removeItem('site_cliente_v1');
      atualizarHeaderConta();
    });

    document.getElementById('tabLogin').addEventListener('click', () => {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabCadastro').classList.remove('active');
      document.getElementById('formLogin').style.display = 'block';
      document.getElementById('formCadastro').style.display = 'none';
    });
    document.getElementById('tabCadastro').addEventListener('click', () => {
      document.getElementById('tabCadastro').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('formCadastro').style.display = 'block';
      document.getElementById('formLogin').style.display = 'none';
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      msgConta.className = 'msg';
      try {
        const res = await fetch(API + '/api/site/cliente/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identificador: document.getElementById('loginIdentificador').value.trim(),
            senha: document.getElementById('loginSenha').value
          })
        });
        const data = await res.json();
        if (!res.ok || data.sucesso === false) return setMsg(msgConta, data.erro || 'Falha no login.');
        clienteLogado = data.cliente;
        localStorage.setItem('site_cliente_v1', JSON.stringify(clienteLogado));
        atualizarHeaderConta();
        setMsg(msgConta, 'Login realizado com sucesso!', true);
        setTimeout(() => modalConta.classList.remove('open'), 600);
      } catch {
        setMsg(msgConta, 'Erro de conexão no login.');
      }
    });

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      msgConta.className = 'msg';
      try {
        const res = await fetch(API + '/api/site/cliente/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: document.getElementById('cadNome').value.trim(),
            telefone: document.getElementById('cadTelefone').value.trim(),
            email: document.getElementById('cadEmail').value.trim(),
            senha: document.getElementById('cadSenha').value
          })
        });
        const data = await res.json();
        if (!res.ok || data.sucesso === false) return setMsg(msgConta, data.erro || 'Não foi possível cadastrar.');
        clienteLogado = data.cliente;
        localStorage.setItem('site_cliente_v1', JSON.stringify(clienteLogado));
        atualizarHeaderConta();
        setMsg(msgConta, 'Conta criada com sucesso!', true);
        setTimeout(() => modalConta.classList.remove('open'), 600);
      } catch {
        setMsg(msgConta, 'Erro de conexão no cadastro.');
      }
    });

    document.getElementById('buscaProduto').addEventListener('input', renderProdutos);
    document.getElementById('filtroCategoria').addEventListener('change', renderProdutos);
    document.getElementById('btnRecarregarProdutos').addEventListener('click', carregarConfigEProdutos);

    atualizarHeaderConta();
    renderCarrinho();
    carregarConfigEProdutos();
  </script>
</body>
</html>
