<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Login</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>Teste Login - Assados</h2>
<input id="mat" value="SV-2026-0001" style="width:100%;padding:10px;margin:5px 0">
<input id="sen" value="123" style="width:100%;padding:10px;margin:5px 0">
<button onclick="testar()" style="width:100%;padding:15px;background:orange;color:white;border:none;border-radius:8px">TESTAR LOGIN</button>
<pre id="out" style="background:#f0f0f0;padding:10px;white-space:pre-wrap;margin-top:20px">Aguardando...</pre>
<script>
async function testar(){
  document.getElementById('out').textContent='Testando...';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matricula:document.getElementById('mat').value,senha:document.getElementById('sen').value})});
    const j = await r.json();
    document.getElementById('out').textContent=JSON.stringify(j,null,2);
    if(j.ok || j.sucesso){ document.getElementById('out').textContent+='\n\n✅ LOGIN OK! Pode ir pro dashboard'; }
    else { document.getElementById('out').textContent+='\n\n❌ Falhou'; }
  }catch(e){ document.getElementById('out').textContent='Erro: '+e.message }
}
</script>
</body></html>
