<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Assados Nobre ERP</title>
<link rel="icon" type="image/png" href="/icons/nobre_premium_moderno.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif}
body{background:#f7f5ef}
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;width:100%;
  background: radial-gradient(1200px 600px at 20% 0%, #1e3a8a 0%, #172554 45%, #020617 100%);
  padding:20px;box-sizing:border-box;
}
#loginScreen .login-box{
  background:#ffffff;border-radius:28px;padding:32px 26px 22px;
  width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.15);border:1px solid #e5e0d4;
}
#loginScreen .login-brand{width:100%;height:172px;object-fit:contain;background:#1e4bd8;border-radius:18px;display:block;margin-bottom:26px;}
#loginScreen h1{color:#c8a028;font-size:28px;font-weight:800;margin:0 0 6px;}
#loginScreen p{color:#697586;font-size:14px;margin:0 0 22px;}
#loginScreen label{color:#202b3c;font-size:14px;font-weight:600;margin:16px 0 8px;display:block;}
#loginScreen input#loginMatricula,#loginScreen input#loginSenha{
  width:100%;height:52px;background:#ffffff;border:1.5px solid #e5e0d4;border-radius:12px;
  padding:0 16px;color:#202b3c;font-size:15px;outline:none;box-sizing:border-box;
}
#loginScreen .senha-wrap{position:relative;width:100%;}
#loginScreen .senha-wrap input{padding-right:48px;}
#loginScreen #btnOlhoLogin{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;background:#ffffff;border:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#697586;
}
#loginScreen button[onclick="fazerLogin()"]{
  width:100%;height:52px;background:#d4a72c;color:#111;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:20px;cursor:pointer;
}
#loginScreen #loginError{margin-top:12px;min-height:18px;font-size:13px;color:#f87171;text-align:center;}
#loginScreen #loginHint{margin-top:14px;background:rgba(212,167,44,0.12);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:#697586;}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <img class="login-brand" src="/icons/nobre_premium_moderno.png" alt="Logo" onerror="this.style.background='#1e4bd8'">
    <h1>Assados Nobre ERP</h1>
    <p>Gestão completa do seu negócio</p>
    <label>Matrícula</label>
    <input type="text" id="loginMatricula" placeholder="Digite sua matrícula" value="SV-2026-0001">
    <label>Senha</label>
    <div class="senha-wrap">
      <input type="password" id="loginSenha" placeholder="Digite sua senha" value="123">
      <button type="button" id="btnOlhoLogin" onclick="document.getElementById('loginSenha').type=document.getElementById('loginSenha').type==='password'?'text':'password'">👁️</button>
    </div>
    <button onclick="fazerLogin()">Entrar</button>
    <div id="loginError"></div>
    <div id="loginHint">Login no Render - chama /api/login</div>
  </div>
</div>
<script>
// LOGIN NO RENDER - chama /api/login do seu servidor Render
async function fazerLogin(){
  const mat=document.getElementById('loginMatricula').value.trim();
  const sen=document.getElementById('loginSenha').value.trim();
  const err=document.getElementById('loginError');
  if(!mat||!sen){ err.textContent='Informe matrícula e senha.'; return; }
  err.textContent='Entrando no Render...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matricula:mat,senha:sen})});
    const j=await r.json();
    console.log('resposta login', j);
    if(!j.sucesso){ err.textContent=j.erro||'Falha no login'; return; }
    const user=j.usuario||j.funcionario;
    // Guarda token no navegador (localStorage do dominio assados.onrender.com) - nao e arquivo local
    localStorage.setItem('erp_user', JSON.stringify(user));
    localStorage.setItem('erp_token', j.token);
    localStorage.setItem('token', j.token);
    err.textContent='OK! Indo pro dashboard...';
    setTimeout(()=>{ window.location.href='/dashboard.html'; }, 600);
  }catch(e){ err.textContent='Erro: '+e.message+' - verifique se /api/login existe no Render'; }
}
// Se ja logado no Render, vai direto pro dashboard
try{
  const t=localStorage.getItem('erp_token');
  const u=localStorage.getItem('erp_user');
  if(t&&u){ window.location.href='/dashboard.html'; }
}catch(e){}
</script>
</body>
</html>
